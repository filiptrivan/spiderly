name: Release Pipeline
run-name: Release ${{ inputs.release_type }} (${{ inputs.version_bump }}) from ${{ github.ref_name }}${{ inputs.dry_run && ' [dry-run]' || '' }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - preview
      version_bump:
        description: "Version bump (required for stable, optional for preview)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - major
          - minor
          - patch
      preview_label:
        description: "Preview label (only for preview releases)"
        required: false
        default: "preview"
        type: string
      dry_run:
        description: "Dry run (skip publishing)"
        required: false
        default: false
        type: boolean
      publish_shared:
        description: "Publish Spiderly.Shared"
        required: false
        default: true
        type: boolean
      publish_sourcegenerators:
        description: "Publish Spiderly.SourceGenerators"
        required: false
        default: true
        type: boolean
      publish_security:
        description: "Publish Spiderly.Security"
        required: false
        default: true
        type: boolean
      publish_infrastructure:
        description: "Publish Spiderly.Infrastructure"
        required: false
        default: true
        type: boolean
      publish_cli:
        description: "Publish Spiderly.CLI"
        required: false
        default: true
        type: boolean
      publish_angular:
        description: "Publish spiderly (Angular/npm)"
        required: false
        default: true
        type: boolean

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.NEW_VERSION }}
      is_prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
      dotnet_packages: ${{ steps.packages.outputs.dotnet_packages }}
      publish_angular: ${{ steps.packages.outputs.publish_angular }}
      has_dotnet_packages: ${{ steps.packages.outputs.has_dotnet_packages }}

    steps:
      - name: Enforce develop branch
        if: inputs.dry_run != true
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/develop" ]; then
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "The release pipeline fast-forwards 'main' from 'develop' as part of finalize."
            echo "Running from any other branch would publish that branch's code under a fresh version."
            echo "::error::Release pipeline must be run from 'develop' (got: ${GITHUB_REF_NAME}). See spiderly/CLAUDE.md."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          current_version=$(grep -oPm1 "(?<=<Version>)[^<]+" Spiderly.Shared/Spiderly.Shared.csproj)
          echo "Current version: $current_version"

          base_version="$current_version"
          is_preview="false"
          if [[ "$current_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            base_version="${BASH_REMATCH[1]}"
            if [ "$current_version" != "$base_version" ]; then
              is_preview="true"
            fi
          fi

          echo "CURRENT_VERSION=$current_version" >> $GITHUB_OUTPUT
          echo "BASE_VERSION=$base_version" >> $GITHUB_OUTPUT
          echo "IS_PREVIEW=$is_preview" >> $GITHUB_OUTPUT

      - name: Validate inputs
        run: |
          if [ "${{ inputs.release_type }}" == "stable" ] && [ "${{ inputs.version_bump }}" == "none" ] && [ "${{ steps.current.outputs.IS_PREVIEW }}" == "false" ]; then
            echo "::error::Version bump is required for stable releases from a stable version. Use 'none' only when promoting a preview to stable."
            exit 1
          fi

          if [ "${{ inputs.publish_shared }}" != "true" ] && \
             [ "${{ inputs.publish_sourcegenerators }}" != "true" ] && \
             [ "${{ inputs.publish_security }}" != "true" ] && \
             [ "${{ inputs.publish_infrastructure }}" != "true" ] && \
             [ "${{ inputs.publish_cli }}" != "true" ] && \
             [ "${{ inputs.publish_angular }}" != "true" ]; then
            echo "::error::At least one package must be selected for publishing"
            exit 1
          fi

      - name: Build package selection
        id: packages
        run: |
          packages=()

          [ "${{ inputs.publish_shared }}" == "true" ] && packages+=("Spiderly.Shared")
          [ "${{ inputs.publish_sourcegenerators }}" == "true" ] && packages+=("Spiderly.SourceGenerators")
          [ "${{ inputs.publish_security }}" == "true" ] && packages+=("Spiderly.Security")
          [ "${{ inputs.publish_infrastructure }}" == "true" ] && packages+=("Spiderly.Infrastructure")
          [ "${{ inputs.publish_cli }}" == "true" ] && packages+=("Spiderly.CLI")

          if [ ${#packages[@]} -eq 0 ]; then
            packages_json="[]"
            has_packages="false"
          else
            packages_json=$(printf '%s\n' "${packages[@]}" | jq -R . | jq -sc .)
            has_packages="true"
          fi

          echo "dotnet_packages=$packages_json" >> $GITHUB_OUTPUT
          echo "publish_angular=${{ inputs.publish_angular }}" >> $GITHUB_OUTPUT
          echo "has_dotnet_packages=$has_packages" >> $GITHUB_OUTPUT

          echo "Selected .NET packages: ${packages[*]}"
          echo "Publish Angular: ${{ inputs.publish_angular }}"

      - name: Calculate new version
        id: version
        run: |
          current_version="${{ steps.current.outputs.CURRENT_VERSION }}"
          base_version="${{ steps.current.outputs.BASE_VERSION }}"

          IFS='.' read -ra parts <<< "$base_version"
          version_bump="${{ inputs.version_bump }}"

          if [ "${{ inputs.release_type }}" == "stable" ]; then
            case "$version_bump" in
              none) new_version="$base_version" ;;
              major) new_version="$((parts[0] + 1)).0.0" ;;
              minor) new_version="${parts[0]}.$(( parts[1] + 1 )).0" ;;
              patch) new_version="${parts[0]}.${parts[1]}.$(( parts[2] + 1 ))" ;;
            esac
            is_prerelease="false"
            echo "Stable release: $new_version"
          else
            preview_label="${{ inputs.preview_label }}"

            if [ "$version_bump" != "none" ]; then
              case "$version_bump" in
                major) base_version="$((parts[0] + 1)).0.0" ;;
                minor) base_version="${parts[0]}.$(( parts[1] + 1 )).0" ;;
                patch) base_version="${parts[0]}.${parts[1]}.$(( parts[2] + 1 ))" ;;
              esac
              new_version="${base_version}-${preview_label}.0"
              echo "Bumped version to $base_version and started preview series"
            else
              if [[ "$current_version" =~ -${preview_label}\.([0-9]+)$ ]]; then
                existing_number="${BASH_REMATCH[1]}"
                new_number=$(( existing_number + 1 ))
                new_version="${base_version}-${preview_label}.${new_number}"
                echo "Incremented preview: ${existing_number} → ${new_number}"
              else
                echo "::error::Cannot create preview with 'none' bump from stable version $current_version"
                exit 1
              fi
            fi
            is_prerelease="true"
          fi

          echo "NEW_VERSION=$new_version" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=$is_prerelease" >> $GITHUB_OUTPUT
          echo "New version: $new_version"

  build-dotnet:
    name: Build .NET Packages
    needs: validate
    if: needs.validate.outputs.has_dotnet_packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.validate.outputs.dotnet_packages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Update version
        run: |
          project="${{ matrix.package }}/${{ matrix.package }}.csproj"
          new_version="${{ needs.validate.outputs.new_version }}"
          sed -i "s|<Version>.*</Version>|<Version>$new_version</Version>|" "$project"
          echo "Updated $project to $new_version"

      - name: Restore dependencies
        run: dotnet restore "${{ matrix.package }}/${{ matrix.package }}.csproj"

      - name: Build
        run: dotnet build -c Release "${{ matrix.package }}/${{ matrix.package }}.csproj"

      - name: Pack
        run: |
          dotnet pack -c Release \
            -o ./artifacts \
            /p:PackageVersion=${{ needs.validate.outputs.new_version }} \
            "${{ matrix.package }}/${{ matrix.package }}.csproj"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-${{ matrix.package }}
          path: ./artifacts/*.nupkg
          retention-days: 1

      - name: Upload version file
        uses: actions/upload-artifact@v7
        with:
          name: version-${{ matrix.package }}
          path: ${{ matrix.package }}/${{ matrix.package }}.csproj
          retention-days: 1

  test-dotnet:
    name: Test .NET
    needs: [validate, build-dotnet]
    if: needs.validate.outputs.has_dotnet_packages == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release

      - name: Run tests
        run: dotnet test -c Release --no-build --verbosity normal

  build-angular:
    name: Build Angular Package
    needs: validate
    if: needs.validate.outputs.publish_angular == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: "npm"
          cache-dependency-path: Angular/package-lock.json

      - name: Update version
        run: |
          cd Angular/projects/spiderly
          npm version ${{ needs.validate.outputs.new_version }} --no-git-tag-version
          echo "Updated Angular package to ${{ needs.validate.outputs.new_version }}"

      - name: Install dependencies
        run: |
          cd Angular
          npm ci

      - name: Build
        run: |
          cd Angular
          npx ng build spiderly --configuration production

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: Angular/dist/spiderly/
          retention-days: 1

      - name: Upload version file
        uses: actions/upload-artifact@v7
        with:
          name: version-angular
          path: Angular/projects/spiderly/package.json
          retention-days: 1

  # dry_run gates the push command inside the step, not the job — dry runs must rehearse
  # the full publish path (artifact download, file enumeration) so a broken step fails in
  # rehearsal instead of mid-release. Keep it that way; the v1.x .nvmrc incident happened
  # because publish jobs were skipped entirely on dry runs and first ran on a real release.
  publish-nuget:
    name: Publish to NuGet
    needs: [validate, build-dotnet, test-dotnet]
    if: needs.validate.outputs.has_dotnet_packages == 'true' && (inputs.dry_run == true || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    outputs:
      published_packages: ${{ steps.publish.outputs.published_packages }}

    steps:
      - name: Download all NuGet packages
        uses: actions/download-artifact@v8
        with:
          pattern: nupkg-*
          path: ./nupkg
          merge-multiple: true

      - name: Publish to NuGet
        id: publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          published=()
          already_existed=()
          failed=()

          for package in nupkg/*.nupkg; do
            if [ ! -f "$package" ]; then
              echo "No packages found to publish"
              continue
            fi

            package_name=$(basename "$package" .nupkg | sed 's/\.[0-9].*//')

            if [ "${{ inputs.dry_run }}" == "true" ]; then
              echo "[dry-run] Would publish $package_name"
              published+=("$package_name")
              continue
            fi

            echo "Publishing $package..."

            push_output=$(dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json 2>&1) && push_exit=0 || push_exit=$?

            if [ $push_exit -eq 0 ]; then
              published+=("$package_name")
              echo "Successfully published $package_name"
            elif echo "$push_output" | grep -qi "already exists"; then
              already_existed+=("$package_name")
              echo "::warning::$package_name already exists on NuGet.org (treating as success for retry safety)"
            else
              failed+=("$(basename "$package")")
              echo "::warning::Failed to publish $package"
              echo "$push_output"
            fi
          done

          echo ""
          echo "--- Publish Summary ---"
          echo "Published: ${published[*]:-none}"
          echo "Already existed: ${already_existed[*]:-none}"
          echo "Failed: ${failed[*]:-none}"
          echo "---"

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed to publish: ${failed[*]}"
            exit 1
          fi

          if [ ${#published[@]} -eq 0 ] && [ ${#already_existed[@]} -gt 0 ]; then
            echo "::warning::All packages already exist on NuGet.org. This is expected for retries, but check the version if this is a fresh release."
          fi

          all_succeeded=("${published[@]}" "${already_existed[@]}")
          published_json=$(printf '%s\n' "${all_succeeded[@]}" | jq -R . | jq -sc . 2>/dev/null || echo "[]")
          echo "published_packages=$published_json" >> $GITHUB_OUTPUT

  # npm publishes after NuGet so that a NuGet failure stops the pipeline before
  # any npm package is pushed — keeping registries in sync and avoiding partial releases.
  publish-npm:
    name: Publish to npm
    needs: [validate, build-angular, publish-nuget]
    if: |
      always() &&
      (inputs.dry_run == true || github.ref == 'refs/heads/develop') &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.publish_angular == 'true' &&
      needs.build-angular.result == 'success' &&
      (needs.publish-nuget.result == 'success' || needs.publish-nuget.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.success }}

    steps:
      # This job is deliberately artifact-only — a full checkout here would fetch current
      # develop HEAD, which may be newer than the commit the artifact was built from. But
      # setup-node reads .nvmrc from the workspace, so fetch just that one file.
      - name: Checkout .nvmrc
        uses: actions/checkout@v7
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: "https://registry.npmjs.org"

      - name: Download npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: ./dist

      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd dist

          args=(--access public)
          if [ "${{ needs.validate.outputs.is_prerelease }}" = "true" ]; then
            args+=(--tag "${{ inputs.preview_label }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi

          npm publish "${args[@]}"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: package packed and validated, nothing uploaded"
          elif [ "${{ needs.validate.outputs.is_prerelease }}" = "true" ]; then
            echo "Published as preview with tag: ${{ inputs.preview_label }}"
          else
            echo "Published as latest stable"
          fi

          echo "success=true" >> $GITHUB_OUTPUT

  create-release:
    name: Create GitHub Release
    needs: [validate, publish-nuget, publish-npm]
    if: |
      always() &&
      inputs.dry_run != true &&
      github.ref == 'refs/heads/develop' &&
      needs.validate.outputs.is_prerelease == 'false' &&
      (needs.publish-nuget.result == 'success' || needs.publish-nuget.result == 'skipped') &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-nuget.result == 'success' || needs.publish-npm.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all NuGet packages
        if: needs.validate.outputs.has_dotnet_packages == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: nupkg-*
          path: ./nupkg
          merge-multiple: true

      - name: Generate Release Notes
        id: notes
        run: |
          new_version="${{ needs.validate.outputs.new_version }}"
          previous_tag=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | grep -v -- "-" | head -n 1)

          {
            echo "## What's Changed"
            echo ""
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..HEAD" --pretty=format:"- %s (%h)" --no-merges | grep -v "^- chore: bump version"
            else
              git log --pretty=format:"- %s (%h)" --no-merges -n 20 | grep -v "^- chore: bump version"
            fi
            echo ""
            echo ""
            echo "## Packages Published"
            echo ""
          } > release_notes.md

          dotnet_packages='${{ needs.validate.outputs.dotnet_packages }}'
          if [ "$dotnet_packages" != "[]" ] && [ -n "$dotnet_packages" ]; then
            echo "### NuGet Packages" >> release_notes.md
            echo "$dotnet_packages" | jq -r '.[]' | while read package; do
              echo "- [$package $new_version](https://www.nuget.org/packages/$package/$new_version)" >> release_notes.md
            done
            echo "" >> release_notes.md
          fi

          if [ "${{ needs.validate.outputs.publish_angular }}" == "true" ]; then
            echo "### npm Package" >> release_notes.md
            echo "- [spiderly $new_version](https://www.npmjs.com/package/spiderly/v/$new_version)" >> release_notes.md
            echo "" >> release_notes.md
          fi

          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$previous_tag...v$new_version" >> release_notes.md

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="v${{ needs.validate.outputs.new_version }}"
          git tag "$tag"
          git push origin "$tag"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.new_version }}
          name: Release v${{ needs.validate.outputs.new_version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          files: nupkg/*.nupkg
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    name: Finalize Release
    needs: [validate, create-release, publish-nuget, publish-npm]
    if: |
      always() &&
      inputs.dry_run != true &&
      github.ref == 'refs/heads/develop' &&
      (needs.publish-nuget.result == 'success' || needs.publish-nuget.result == 'skipped') &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-nuget.result == 'success' || needs.publish-npm.result == 'success') &&
      (needs.create-release.result == 'success' || needs.validate.outputs.is_prerelease == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download version files
        uses: actions/download-artifact@v8
        with:
          pattern: version-*
          path: ./versions

      - name: Commit version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          dotnet_packages='${{ needs.validate.outputs.dotnet_packages }}'
          if [ "$dotnet_packages" != "[]" ] && [ -n "$dotnet_packages" ]; then
            echo "$dotnet_packages" | jq -r '.[]' | while read package; do
              if [ -f "versions/version-$package/$package.csproj" ]; then
                cp "versions/version-$package/$package.csproj" "$package/$package.csproj"
                git add "$package/$package.csproj"
              fi
            done
          fi

          if [ "${{ needs.validate.outputs.publish_angular }}" == "true" ] && [ -f "versions/version-angular/package.json" ]; then
            cp "versions/version-angular/package.json" "Angular/projects/spiderly/package.json"
            git add "Angular/projects/spiderly/package.json"
          fi

          # Bump spiderly-cli/package.json in lockstep with the framework.
          # (lives in finalize, not a build matrix lane — produces no artifact)
          new_version="${{ needs.validate.outputs.new_version }}"
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$new_version\"|" spiderly-cli/package.json
          git add spiderly-cli/package.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to ${{ needs.validate.outputs.new_version }}"
            git push
          else
            echo "No version changes to commit"
          fi

      - name: Merge to main
        if: needs.validate.outputs.is_prerelease == 'false'
        run: |
          echo "Fast-forwarding main to match develop..."

          git fetch origin main
          git checkout main
          git merge --ff-only origin/develop
          git push origin main

          echo "Successfully fast-forwarded main"

      # Push the single-source-of-truth metadata into the docs site so it can render the framework
      # reference tables (see docs/framework-metadata-ssot.md). Runs before the develop→master
      # fast-forward below so it ships in the same release. continue-on-error: a docs-sync hiccup
      # must not block the fast-forward below (the trailing notification step reports it). The
      # committed framework-metadata.json is release-accurate as-is (it carries no version field),
      # so no regeneration is needed here.
      - name: Sync framework-metadata.json to spiderly-website
        id: website_metadata
        if: needs.validate.outputs.is_prerelease == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REPO="filiptrivan/spiderly-website"
          TARGET="src/lib/framework-metadata.json"
          echo "Syncing framework-metadata.json to $REPO ($TARGET)..."

          tmp=$(mktemp -d)
          git clone --depth 1 --branch develop "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git" "$tmp"
          mkdir -p "$(dirname "$tmp/$TARGET")"
          cp framework-metadata.json "$tmp/$TARGET"

          cd "$tmp"
          if git diff --quiet -- "$TARGET"; then
            echo "framework-metadata.json already up to date in $REPO"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$TARGET"
            git commit -m "chore: sync framework-metadata.json for v${{ needs.validate.outputs.new_version }}"
            git push origin develop
            echo "Pushed framework-metadata.json to $REPO develop"
          fi

      # The website mirrors this repo's linear model: master must always be an ancestor of develop,
      # and a release just fast-forwards master's ref to develop. A non-force ref update is rejected
      # by GitHub unless it is a fast-forward, so a broken invariant fails loudly here instead of
      # producing a merge conflict (the merge-based predecessor of this step silently filed
      # spiderly-website#75 and nobody heard about it for a month). Hotfix flow that preserves the
      # invariant: commit on master, rebase develop onto master, push --force-with-lease.
      - name: Fast-forward spiderly-website master to develop
        id: website_merge
        if: needs.validate.outputs.is_prerelease == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REPO="filiptrivan/spiderly-website"
          echo "Fast-forwarding $REPO master to develop..."

          DEVELOP_SHA=$(gh api "repos/$REPO/git/refs/heads/develop" --jq '.object.sha')

          if gh api -X PATCH "repos/$REPO/git/refs/heads/master" \
            -f sha="$DEVELOP_SHA" -F force=false --silent; then
            echo "Fast-forwarded master to $DEVELOP_SHA"
          else
            echo "::warning::Fast-forward failed — master is not an ancestor of develop."
            echo "::warning::Rebase develop onto master (git rebase origin/master && git push --force-with-lease), then fast-forward master to develop manually."
            exit 1
          fi

      # The website steps are continue-on-error so they can't abort the release (artifacts are
      # already published), but a green run sends no notification at all — this step turns any
      # website-step failure into a red run so GitHub emails the release actor.
      - name: Fail release run if website sync failed
        if: needs.validate.outputs.is_prerelease == 'false'
        run: |
          FAIL=""
          if [ "${{ steps.website_metadata.outcome }}" = "failure" ]; then
            echo "::error::framework-metadata.json sync to spiderly-website failed — sync it manually."
            FAIL=1
          fi
          if [ "${{ steps.website_merge.outcome }}" = "failure" ]; then
            echo "::error::spiderly-website master fast-forward failed — master is not an ancestor of develop; rebase develop onto master and fast-forward manually (see step log)."
            FAIL=1
          fi
          [ -z "$FAIL" ] || exit 1

  dry-run-summary:
    name: Dry Run Summary
    # publish-nuget/publish-npm must stay in needs even though they look summary-irrelevant:
    # the needs context only exposes declared dependencies, so removing them blanks the
    # rehearsal result lines below.
    needs: [validate, build-dotnet, build-angular, test-dotnet, publish-nuget, publish-npm]
    if: |
      always() &&
      inputs.dry_run == true &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          {
            echo "## Dry Run Complete"
            echo ""
            echo "Version would be bumped to: **${{ needs.validate.outputs.new_version }}**"
            echo ""
            echo "### Build Status"
            echo "- .NET Build: ${{ needs.build-dotnet.result || 'skipped' }}"
            echo "- .NET Tests: ${{ needs.test-dotnet.result || 'skipped' }}"
            echo "- Angular Build: ${{ needs.build-angular.result || 'skipped' }}"
            echo "- NuGet Publish (rehearsal, no upload): ${{ needs.publish-nuget.result || 'skipped' }}"
            echo "- npm Publish (rehearsal, no upload): ${{ needs.publish-npm.result || 'skipped' }}"
            echo ""
            echo "Packages built and publish path rehearsed, but NOTHING was uploaded (dry run mode)"
          } >> $GITHUB_STEP_SUMMARY
