name: CI

on:
  push:
    branches: [main, develop, v*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_VERSION: "9.0.x"
  TEST_APP_NAME: "TestApp"

jobs:
  unit-test:
    name: Unit Tests (.NET)
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Run tests
        run: dotnet test -c Release --verbosity normal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Single-source-of-truth guard: framework-metadata.json (emitted by the C# exporter, then
      # augmented by the TS extractor) and the generated skill reference docs must match the committed
      # copies. If a contract changed in code without regenerating, this fails — see docs/framework-metadata-ssot.md.
      - name: Verify framework-metadata + generated docs are in sync
        run: |
          tools/regen-metadata.sh Release
          if ! git diff --exit-code -- framework-metadata.json 'claude-plugins/skills/*/references/*.generated.md'; then
            echo "::error::framework-metadata.json or generated skill docs are stale. Regenerate and commit:"
            echo "::error::  tools/regen-metadata.sh"
            exit 1
          fi

  integration-test:
    name: Test CLI Generated Application
    needs: unit-test
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment paths
        run: echo "APP_FOLDER=$(dirname "$GITHUB_WORKSPACE")/test-app" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: Angular/package-lock.json

      # Fast-fail lockfile-integrity gate. `npm ci` is the strict variant that
      # cross-checks package.json against package-lock.json — `npm install` is
      # lenient and won't catch a partial/inconsistent lock (npm has a known
      # habit of dropping optional-dep entries when the lock is regenerated on
      # one platform and consumed on another). `--dry-run` does the validation
      # without writing node_modules (the later "Build Spiderly Angular
      # library" step does the real install). This surfaces lock drift in
      # seconds with the clear "Missing X from lock file" message, instead of
      # burying it 10 minutes later mid-build (see commit 62f9070).
      - name: Verify Angular lockfile integrity
        run: |
          cd Angular
          npm ci --dry-run --ignore-scripts

      - name: Setup PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          echo "PostgreSQL setup complete"

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.0.1

      - name: Build and pack all Spiderly packages
        run: |
          dotnet restore
          dotnet build -c Release
          # --no-build breaks SourceGenerators packaging: the GetDependencyTargetPaths target
          # (which bundles analyzer DLLs into analyzers/dotnet/cs/) only runs during build.
          dotnet pack -c Release -o ./nupkg

      - name: Install Spiderly.CLI
        run: |
          dotnet tool install --global Spiderly.CLI --add-source ./nupkg --prerelease

      - name: Add local NuGet source
        run: dotnet nuget add source "$(pwd)/nupkg" --name local-spiderly

      - name: Build Spiderly Angular library
        run: |
          cd Angular
          npm ci
          npm run build -- spiderly --configuration production

      - name: Setup Verdaccio and publish spiderly package
        run: |
          npm install -g verdaccio

          mkdir -p ~/.config/verdaccio
          cat > ~/.config/verdaccio/config.yaml << 'EOF'
          storage: ./storage
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
          packages:
            'spiderly':
              access: $all
              publish: $anonymous
            '@*/*':
              access: $all
              proxy: npmjs
            '**':
              access: $all
              proxy: npmjs
          log: { type: stdout, format: pretty, level: warn }
          EOF

          verdaccio --config ~/.config/verdaccio/config.yaml &

          timeout 30 bash -c 'until curl -sf http://localhost:4873/-/ping > /dev/null 2>&1; do sleep 0.5; done'
          echo "Verdaccio is ready"

          npm config set registry http://localhost:4873/
          npm config set //localhost:4873/:_authToken "fake-token"

          cd Angular/dist/spiderly
          npm publish --registry http://localhost:4873/ --tag latest

      - name: Run Spiderly init
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"

          cd ..

          echo "Running spiderly init with app name: ${{ env.TEST_APP_NAME }}"
          spiderly init --name "${{ env.TEST_APP_NAME }}" --db postgresql

          if [ $? -ne 0 ]; then
            echo "ERROR: spiderly init failed with exit code $?"
            exit 1
          fi

      - name: Add test entities via CLI
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          cd ${{ env.APP_FOLDER }}
          spiderly add-new-entity --name Product
          spiderly add-new-entity --name Project
          spiderly add-new-entity --name TaskComment
          spiderly add-new-entity --name ProjectCharter
          echo "✓ Added test entities via CLI (entity files + Angular pages + routes + menu items)"

      - name: Copy test fixtures
        run: |
          chmod +x "$GITHUB_WORKSPACE/tests/e2e-fixtures/setup.sh"
          "$GITHUB_WORKSPACE/tests/e2e-fixtures/setup.sh" "${{ env.TEST_APP_NAME }}" "${{ env.APP_FOLDER }}"

      - name: Build .NET backend
        run: |
          BACKEND_PATH="${{ env.APP_FOLDER }}/Backend"

          echo "Building .NET backend..."
          cd "$BACKEND_PATH"

          dotnet restore
          if [ $? -ne 0 ]; then exit 1; fi

          dotnet build -c Release --no-restore
          if [ $? -ne 0 ]; then exit 1; fi

          echo "✓ Backend build successful"

      - name: Run EF migration for test entities
        run: |
          INFRASTRUCTURE_PATH="${{ env.APP_FOLDER }}/Backend/${{ env.TEST_APP_NAME }}.Infrastructure"

          cd "$INFRASTRUCTURE_PATH"

          echo "Adding migration for test entities..."
          dotnet ef migrations add AddTestEntities --startup-project ../${{ env.TEST_APP_NAME }}.WebAPI/${{ env.TEST_APP_NAME }}.WebAPI.csproj

          echo "Updating database..."
          dotnet ef database update --startup-project ../${{ env.TEST_APP_NAME }}.WebAPI/${{ env.TEST_APP_NAME }}.WebAPI.csproj

      - name: Build Angular frontend
        run: |
          FRONTEND_PATH="${{ env.APP_FOLDER }}/Frontend"

          echo "Building Angular frontend..."
          cd "$FRONTEND_PATH"
          npm run build -- --configuration=development
          if [ $? -ne 0 ]; then
            echo "ERROR: Angular build failed"
            exit 1
          fi

          echo "✓ Frontend build successful"

      - name: Install Playwright
        run: |
          FRONTEND_PATH="${{ env.APP_FOLDER }}/Frontend"
          cd "$FRONTEND_PATH"

          echo "Installing Playwright browser..."
          # @playwright/test is already installed at the version pinned in the
          # generated Frontend package.json (spiderly init runs npm install).
          # Do NOT install it unpinned here — that pulls a floating version and
          # decouples the browser download host from the pinned Playwright.
          npx playwright install chromium --with-deps

      - name: Create Playwright config
        run: |
          FRONTEND_PATH="${{ env.APP_FOLDER }}/Frontend"

          cat > "$FRONTEND_PATH/playwright.config.ts" <<'PLAYWRIGHTCONFIG'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            fullyParallel: false,
            forbidOnly: !!process.env.CI,
            retries: process.env.CI ? 2 : 0,
            workers: 1,
            reporter: [['github'], ['list'], ['html', { open: 'never' }]],
            use: {
              baseURL: 'http://localhost:4200',
              trace: 'retain-on-failure',
              video: 'on',
            },
            projects: [
              {
                name: 'chromium',
                use: { ...devices['Desktop Chrome'] },
              },
            ],
            webServer: [
              {
                command: 'dotnet run --no-build -c Release --urls=http://localhost:5000',
                cwd: '../Backend/${{ env.TEST_APP_NAME }}.WebAPI',
                port: 5000,
                timeout: 120000,
                reuseExistingServer: false,
                stdout: 'pipe',
                stderr: 'pipe',
              },
              {
                command: 'npx -y serve dist/${{ env.TEST_APP_NAME }}/browser -l 4200 -s',
                url: 'http://localhost:4200',
                timeout: 120000,
                reuseExistingServer: false,
                stdout: 'pipe',
                stderr: 'pipe',
              },
            ],
          });
          PLAYWRIGHTCONFIG

      - name: Run Playwright E2E tests
        run: |
          FRONTEND_PATH="${{ env.APP_FOLDER }}/Frontend"
          cd "$FRONTEND_PATH"

          echo "Running Playwright E2E tests..."
          npx playwright test

          if [ $? -ne 0 ]; then
            echo "✗ E2E tests failed"
            exit 1
          fi

          echo "✓ All E2E tests passed!"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.APP_FOLDER }}/Frontend/playwright-report/
          retention-days: 7

      - name: Test Summary
        if: success()
        run: |
          echo "## Integration Test Summary ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application Generated:** ${{ env.TEST_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tests Completed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Spiderly CLI initialization" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Project structure generation" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Entity creation (Product, Project, TaskComment)" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Test fixtures (TaskCategory, ProjectMember, ProjectTask, User override)" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ .NET backend build" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ EF Core migrations" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Source generators execution" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Angular frontend build" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Playwright E2E tests (Product CRUD, Project CRUD, ProjectTask inline, TaskComment + cascade delete)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Result:** All integration and E2E tests passed! 🎉" >> $GITHUB_STEP_SUMMARY
