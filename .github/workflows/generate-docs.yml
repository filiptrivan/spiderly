name: Generate and Deploy Documentation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  generate-and-deploy-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Spiderly repo
        uses: actions/checkout@v4
        with:
          path: spiderly
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Clone DotNetDocMerge tool repo
        run: git clone https://github.com/filiptrivan/dotnet-docmerge.git
      
      - name: Build and install DotNetDocMerge tool
        run: |
          cd dotnet-docmerge/DotNetDocMerge
          dotnet pack
          dotnet tool install --global --add-source ./nupkg DotNetDocMerge
      
      - name: Generate documentation
        run: |
          cd spiderly
          docmerge
      
      - name: Verify documentation was generated
        run: |
          if [ ! -f "spiderly/documentation.html" ]; then
            echo "Documentation file not found!"
            exit 1
          fi
          echo "Documentation generated successfully!"
          ls -lh spiderly/documentation.html
      
      - name: Checkout spiderly-website repo
        uses: actions/checkout@v4
        with:
          repository: filiptrivan/spiderly-website
          path: website
          #TODO: setup a PAT and save as a repo secret
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
      
      - name: Update documentation in website repo
        run: |
          mkdir -p website/public/assets/docs
          cp spiderly/documentation.html website/public/assets/docs/attributes.html
          echo "Documentation copied to website repo"
      
      - name: Commit and push to website repo
        run: |
          cd website
          git config user.name "Spiderly Docs Bot"
          git config user.email "bot@spiderly.dev"
          git add public/assets/docs/attributes.html
          
          if git diff --staged --quiet; then
            echo "No changes to documentation"
          else
            git commit -m "docs: auto-update attributes documentation from spiderly@${GITHUB_SHA::7}"
            git push origin main
            echo "Documentation pushed to website repo - CD will auto-deploy!"
          fi
        env:
          GITHUB_SHA: ${{ github.sha }}