name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      id-token: write
      actions: read
    uses: filiptrivan/ci-workflows/.github/workflows/claude-gate.yml@v1
    with:
      same_repo_only: true
      review_spec: |
        .NET 9 + Angular 19 code generator (framework shipped to consumers as NuGet + npm packages). Source generators emit base classes; hand-written code extends them.

        BLOCK CLASS (hard-block — high bar, objectively checkable):
        - C# <-> TypeScript contract mirror changed on only one side (ApiErrorCodes, MatchModeCodes, UIControlTypeCodes) — every mirror must change together.
        - a source-generator / public-API change not reflected in the `spiderly init` template (Spiderly.Shared/Helpers/NetAndAngularFilesGenerator.cs), such that a freshly-init'd app would break.
        - a committed secret/credential.

        OWNER-RESERVED: a breaking change to a shipped public API/attribute, a new cross-cutting pattern / architectural precedent, or any change to generated output that affects existing consumers.

        CONVENTIONS (advisory): public members in shipped packages (Spiderly.Shared, Spiderly.Security, Spiderly.Infrastructure) need /// <summary> XML docs; remove dead code left by deletions; reuse existing helpers instead of duplicating; logic errors; security.

        SKIP: framework-metadata.json, any *.generated.md, Angular/projects/spiderly/agent/**, and anything under obj/, bin/, node_modules/, or .source/.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
