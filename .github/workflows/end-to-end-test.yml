name: End to End Spiderly Test

on:
  push:
    branches: [main, develop, v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "24"
  TEST_APP_NAME: "TestApp"

jobs:
  integration-test:
    name: Test CLI Generated Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment paths
        run: echo "APP_FOLDER=$(dirname "$GITHUB_WORKSPACE")/test-app" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Angular/package-lock.json

      - name: Setup PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          echo "PostgreSQL setup complete"

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.0.1

      - name: Build and pack all Spiderly packages
        run: |
          dotnet restore
          dotnet build -c Release
          # --no-build breaks SourceGenerators packaging: the GetDependencyTargetPaths target
          # (which bundles analyzer DLLs into analyzers/dotnet/cs/) only runs during build.
          dotnet pack -c Release -o ./nupkg

      - name: Install Spiderly.CLI
        run: |
          dotnet tool install --global Spiderly.CLI --add-source ./nupkg --prerelease

      - name: Add local NuGet source
        run: dotnet nuget add source "$(pwd)/nupkg" --name local-spiderly

      - name: Build Spiderly Angular library
        run: |
          cd Angular
          npm ci
          npm run build -- spiderly --configuration production

      - name: Setup Verdaccio and publish spiderly package
        run: |
          npm install -g verdaccio

          mkdir -p ~/.config/verdaccio
          cat > ~/.config/verdaccio/config.yaml << 'EOF'
          storage: ./storage
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
          packages:
            'spiderly':
              access: $all
              publish: $anonymous
            '@*/*':
              access: $all
              proxy: npmjs
            '**':
              access: $all
              proxy: npmjs
          log: { type: stdout, format: pretty, level: warn }
          EOF

          verdaccio --config ~/.config/verdaccio/config.yaml &

          timeout 30 bash -c 'until curl -sf http://localhost:4873/-/ping > /dev/null 2>&1; do sleep 0.5; done'
          echo "Verdaccio is ready"

          npm config set registry http://localhost:4873/
          npm config set //localhost:4873/:_authToken "fake-token"

          cd Angular/dist/spiderly
          npm publish --registry http://localhost:4873/ --tag latest

      - name: Run Spiderly init
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"

          cd ..

          echo "Running spiderly init with app name: ${{ env.TEST_APP_NAME }}"
          spiderly init --name "${{ env.TEST_APP_NAME }}" --db postgresql

          if [ $? -ne 0 ]; then
            echo "ERROR: spiderly init failed with exit code $?"
            exit 1
          fi

      - name: Add test entity via CLI
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          cd ${{ env.APP_FOLDER }}
          spiderly add-new-entity --name Product
          echo "✓ Added test entity via CLI (entity file + Angular pages + routes + menu item)"

      - name: Overwrite entity with detailed properties
        run: |
          APP_NAME="${{ env.TEST_APP_NAME }}"
          ENTITY_FILE="${{ env.APP_FOLDER }}/Backend/$APP_NAME.Business/Entities/Product.cs"

          cat > "$ENTITY_FILE" <<'PRODUCTCS'
          using System.ComponentModel.DataAnnotations;
          using Spiderly.Shared.Attributes.Entity;
          using Spiderly.Shared.Attributes.Entity.UI;
          using Spiderly.Shared.BaseEntities;
          using Spiderly.Shared.Enums;

          namespace ${{ env.TEST_APP_NAME }}.Business.Entities
          {
              [DoNotAuthorize]
              public class Product : BusinessObject<int>
              {
                  [DisplayName]
                  [Required]
                  [MaxLength(100)]
                  public string Name { get; set; }

                  [UIControlType(nameof(UIControlTypeCodes.TextArea))]
                  [MaxLength(500)]
                  public string Description { get; set; }

                  [Required]
                  [Range(0.01, 999999.99)]
                  public decimal Price { get; set; }

                  [Range(0, 999999)]
                  public int Stock { get; set; }

                  public bool? IsActive { get; set; }
              }
          }
          PRODUCTCS
          echo "✓ Overwrote Product.cs with detailed properties"

      - name: Build .NET backend
        run: |
          BACKEND_PATH="${{ env.APP_FOLDER }}/Backend"

          echo "Building .NET backend..."
          cd "$BACKEND_PATH"

          dotnet restore
          if [ $? -ne 0 ]; then exit 1; fi

          dotnet build -c Release --no-restore
          if [ $? -ne 0 ]; then exit 1; fi

          echo "✓ Backend build successful"

      - name: Run EF migration for Product entity
        run: |
          INFRASTRUCTURE_PATH="${{ env.APP_FOLDER }}/Backend/${{ env.TEST_APP_NAME }}.Infrastructure"

          cd "$INFRASTRUCTURE_PATH"

          echo "Adding migration for Product entity..."
          dotnet ef migrations add AddProductEntity --startup-project ../${{ env.TEST_APP_NAME }}.WebAPI/${{ env.TEST_APP_NAME }}.WebAPI.csproj

          echo "Updating database..."
          dotnet ef database update --startup-project ../${{ env.TEST_APP_NAME }}.WebAPI/${{ env.TEST_APP_NAME }}.WebAPI.csproj

      - name: Build Angular frontend
        run: |
          FRONTEND_PATH="${{ env.APP_FOLDER }}/Frontend"

          echo "Building Angular frontend..."
          cd "$FRONTEND_PATH"
          npm run build -- --configuration=development
          if [ $? -ne 0 ]; then
            echo "ERROR: Angular build failed"
            exit 1
          fi

          echo "✓ Frontend build successful"

      - name: Install Playwright
        run: |
          FRONTEND_PATH="${{ env.APP_FOLDER }}/Frontend"
          cd "$FRONTEND_PATH"

          echo "Installing Playwright..."
          npm install -D @playwright/test
          npx playwright install chromium --with-deps

      - name: Create E2E tests
        run: |
          FRONTEND_PATH="${{ env.APP_FOLDER }}/Frontend"
          E2E_FOLDER="$FRONTEND_PATH/e2e"
          mkdir -p "$E2E_FOLDER"

          cat > "$FRONTEND_PATH/playwright.config.ts" <<'PLAYWRIGHTCONFIG'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            fullyParallel: false,
            forbidOnly: !!process.env.CI,
            retries: process.env.CI ? 2 : 0,
            workers: 1,
            reporter: 'html',
            use: {
              baseURL: 'http://localhost:4200',
              trace: 'retain-on-failure',
              video: 'on',
            },
            projects: [
              {
                name: 'chromium',
                use: { ...devices['Desktop Chrome'] },
              },
            ],
            webServer: [
              {
                command: 'dotnet run --no-build -c Release --urls=http://localhost:5000',
                cwd: '../Backend/${{ env.TEST_APP_NAME }}.WebAPI',
                port: 5000,
                timeout: 120000,
                reuseExistingServer: false,
                stdout: 'pipe',
                stderr: 'pipe',
              },
              {
                command: 'npx -y serve dist/${{ env.TEST_APP_NAME }}/browser -l 4200 -s',
                url: 'http://localhost:4200',
                timeout: 120000,
                reuseExistingServer: false,
                stdout: 'pipe',
                stderr: 'pipe',
              },
            ],
          });
          PLAYWRIGHTCONFIG

          cat > "$E2E_FOLDER/product.spec.ts" <<'E2ETEST'
          import { test, expect } from '@playwright/test';

          test.describe('Product CRUD Operations', () => {
            let accessToken: string;
            let refreshToken: string;
            let productId: number;

            test.beforeAll(async ({ request }) => {
              const sendCodeResponse = await request.post(
                'http://localhost:5000/api/Security/SendLoginVerificationEmail',
                { data: { email: 'test@e2e.com', browserId: 'e2e-browser' } }
              );
              expect(sendCodeResponse.ok()).toBeTruthy();
              const sendCodeResult = await sendCodeResponse.json();
              const verificationCode = sendCodeResult.verificationCode;
              expect(verificationCode).toBeTruthy();

              const loginResponse = await request.post(
                'http://localhost:5000/api/Security/Login',
                {
                  data: {
                    verificationCode,
                    email: 'test@e2e.com',
                    browserId: 'e2e-browser',
                  },
                }
              );
              expect(loginResponse.ok()).toBeTruthy();
              const loginResult = await loginResponse.json();
              accessToken = loginResult.accessToken;
              refreshToken = loginResult.refreshToken;
              expect(accessToken).toBeTruthy();
            });

            test('should create a new product via API', async ({ request }) => {
              const response = await request.put(
                'http://localhost:5000/api/Product/SaveProduct',
                {
                  headers: { Authorization: `Bearer ${accessToken}` },
                  data: {
                    productDTO: {
                      name: 'E2E Test Product',
                      description: 'Created by Playwright E2E test',
                      price: 99.99,
                      stock: 100,
                      isActive: true,
                    },
                  },
                }
              );
              expect(response.ok()).toBeTruthy();
              const result = await response.json();
              expect(result.productDTO.id).toBeDefined();
              expect(result.productDTO.name).toBe('E2E Test Product');
              productId = result.productDTO.id;
            });

            test('should retrieve product via API', async ({ request }) => {
              const response = await request.get(
                'http://localhost:5000/api/Product/GetProductList',
                { headers: { Authorization: `Bearer ${accessToken}` } }
              );
              expect(response.ok()).toBeTruthy();
              const products = await response.json();
              expect(Array.isArray(products)).toBeTruthy();
            });

            async function authenticateBrowser(page: any) {
              await page.goto('/');
              await page.evaluate(([at, rt]: [string, string]) => {
                localStorage.setItem('access_token', at);
                localStorage.setItem('refresh_token', rt);
                localStorage.setItem('browser_id', 'e2e-browser');
              }, [accessToken, refreshToken]);
              await page.reload();
              await page.waitForLoadState('networkidle');
            }

            test('should load the application homepage', async ({ page }) => {
              await authenticateBrowser(page);
              await expect(page).toHaveTitle(/${{ env.TEST_APP_NAME }}/);
              await expect(page).not.toHaveURL(/.*login.*/);
            });

            test('should navigate to product list page', async ({ page }) => {
              await authenticateBrowser(page);
              const productLink = page.locator('text=Product').first();
              await expect(productLink).toBeVisible();
              await productLink.click();
              await page.waitForURL('**/product**');
            });

            test('should update product via API', async ({ request }) => {
              if (!productId) test.skip();
              const response = await request.put(
                'http://localhost:5000/api/Product/SaveProduct',
                {
                  headers: { Authorization: `Bearer ${accessToken}` },
                  data: {
                    productDTO: {
                      id: productId,
                      name: 'Updated E2E Product',
                      description: 'Updated by E2E test',
                      price: 149.99,
                      stock: 50,
                      isActive: true,
                    },
                  },
                }
              );
              expect(response.ok()).toBeTruthy();
            });

            test('should delete product via API', async ({ request }) => {
              if (!productId) test.skip();
              const response = await request.delete(
                `http://localhost:5000/api/Product/DeleteProduct?id=${productId}`,
                { headers: { Authorization: `Bearer ${accessToken}` } }
              );
              expect(response.ok()).toBeTruthy();
            });
          });
          E2ETEST

          echo "✓ Created Playwright E2E tests"

      - name: Run Playwright E2E tests
        run: |
          FRONTEND_PATH="${{ env.APP_FOLDER }}/Frontend"
          cd "$FRONTEND_PATH"

          echo "Running Playwright E2E tests..."
          npx playwright test --reporter=list

          if [ $? -ne 0 ]; then
            echo "✗ E2E tests failed"
            exit 1
          fi

          echo "✓ All E2E tests passed!"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.APP_FOLDER }}/Frontend/playwright-report/
          retention-days: 7

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: ${{ env.APP_FOLDER }}/Frontend/test-results/
          retention-days: 7

      - name: Test Summary
        if: success()
        run: |
          echo "## Integration Test Summary ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application Generated:** ${{ env.TEST_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tests Completed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Spiderly CLI initialization" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Project structure generation" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Entity creation (Product)" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ .NET backend build" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ EF Core migrations" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Source generators execution" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Angular frontend build" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Playwright E2E tests (API + UI)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Result:** All integration and E2E tests passed! 🎉" >> $GITHUB_STEP_SUMMARY
