name: Agent Evals

# Out-of-band, manual-only. Real agent runs cost money and are non-deterministic, so this is NEVER
# wired into a per-PR/per-release gate (see docs/superpowers/specs/2026-06-14-agent-eval-harness-
# design.md -> "Validation strategy"). The cheap, deterministic harness self-test runs in ci.yml's
# unit-test job instead.
#
# NOTE: untested first draft — it mirrors ci.yml's proven integration-test scaffold, but the
# fixture build + Claude CLI install must be validated by a first `workflow_dispatch` run. The
# `claude` agent authenticates with a Claude Pro/Max subscription via the `CLAUDE_CODE_OAUTH_TOKEN`
# repo secret (generate locally with `claude setup-token`; valid ~1 year — regenerate before it
# lapses). Run `oracle,noop` for a free dry run that needs no token. This harness is
# subscription-only by design — do NOT add or suggest `ANTHROPIC_API_KEY` / per-use API-key billing.
#
# TODO (after the first green dispatch):
#  - Extract the shared build->pack->Verdaccio->`spiderly init` scaffold (duplicated from ci.yml's
#    integration-test job) into a composite action both workflows call.
#  - The atomic tier keeps only Backend, yet still builds the Angular lib + publishes to Verdaccio
#    for `spiderly init`. If init can scaffold backend-only, gate those steps to skip them here.
on:
  workflow_dispatch:
    inputs:
      agents:
        description: "Comma-separated agents (e.g. `claude`, or `oracle,noop` for a free self-test)"
        type: string
        default: claude
      reps:
        description: "Reps per task (bump to 5-10 before trusting a delta between bundle versions)"
        type: string
        default: "3"
      tier:
        description: "Task tier to run"
        type: choice
        options: [atomic, feature, full-app]
        default: atomic

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "9.0.x"
  TEST_APP_NAME: "TestApp"

jobs:
  agent-evals:
    name: Run agent evals (out-of-band)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set environment paths
        run: echo "APP_FOLDER=$(dirname "$GITHUB_WORKSPACE")/test-app" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: Angular/package-lock.json

      # --- Deterministic harness self-test (cheap, no toolchain, no cost) ---
      # Same gate as ci.yml; runs first so a broken harness fails fast before any paid agent run.
      - name: Harness self-test
        run: cd tools && npm run test:evals

      # Fail fast on a bad/expired Claude token BEFORE the ~8-min fixture build. Only for `claude`
      # runs. Installs the CLI here (reused by "Run evals"), then makes a tiny real `claude -p` probe
      # that fails the job in seconds on a 401 instead of a silent 0-token no-op after the build.
      - name: Verify Claude auth (fail fast)
        if: contains(inputs.agents, 'claude')
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          # `claude auth status` only confirms a token is PRESENT — it returns loggedIn:true even for
          # an invalid/expired token. A tiny real call validates it against the API; is_error catches a
          # 401 here (seconds) instead of after the ~8-min fixture build.
          probe=$(claude -p "Reply with exactly: OK" --max-turns 1 --output-format json || true)
          echo "$probe"
          if echo "$probe" | grep -q '"is_error":true'; then
            echo "::error::Claude auth probe failed — invalid/expired CLAUDE_CODE_OAUTH_TOKEN. Regenerate with 'claude setup-token' and update the repo secret."
            exit 1
          fi

      # --- Build the `spiderly-app` fixture in CI (the pre-task state) ---
      # Mirrors ci.yml's integration-test scaffold: build+pack packages, publish the Angular lib to a
      # local Verdaccio, install the CLI, then `spiderly init`. The WHOLE real init app is kept as the
      # fixture — guidance included (AGENTS.md + docs + .claude/skills) — so the with-Spiderly arm
      # mirrors what a real Spiderly developer has. Stripping it to Backend-only would delete exactly
      # that guidance (the bug we fixed one level up). UNVALIDATED until the first workflow_dispatch.
      - name: Build and pack all Spiderly packages
        run: |
          dotnet restore
          dotnet build -c Release
          # --no-build breaks SourceGenerators packaging; let pack build.
          dotnet pack -c Release -o ./nupkg

      - name: Install Spiderly.CLI
        run: dotnet tool install --global Spiderly.CLI --add-source ./nupkg --prerelease

      - name: Add local NuGet source
        run: dotnet nuget add source "$(pwd)/nupkg" --name local-spiderly

      - name: Build Spiderly Angular library
        run: |
          cd Angular
          npm ci
          npm run build -- spiderly --configuration production

      - name: Setup Verdaccio and publish spiderly package
        run: |
          npm install -g verdaccio
          mkdir -p ~/.config/verdaccio
          cat > ~/.config/verdaccio/config.yaml << 'EOF'
          storage: ./storage
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
          packages:
            'spiderly':
              access: $all
              publish: $anonymous
            '@*/*':
              access: $all
              proxy: npmjs
            '**':
              access: $all
              proxy: npmjs
          log: { type: stdout, format: pretty, level: warn }
          EOF
          verdaccio --config ~/.config/verdaccio/config.yaml &
          timeout 30 bash -c 'until curl -sf http://localhost:4873/-/ping > /dev/null 2>&1; do sleep 0.5; done'
          npm config set registry http://localhost:4873/
          npm config set //localhost:4873/:_authToken "fake-token"
          cd Angular/dist/spiderly
          npm publish --registry http://localhost:4873/ --tag latest

      - name: Run Spiderly init
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          cd ..
          # --db skip: the eval only runs `dotnet build` (no DB / migrations / running app), so we
          # skip DB provisioning entirely. That's why this workflow needs no Postgres service —
          # unlike ci.yml's integration-test, which boots the app and so sets up Postgres first.
          spiderly init --name "${{ env.TEST_APP_NAME }}" --db skip

      # Set up the agent guidance the WITH-Spiderly arm depends on. `spiderly init` already runs
      # agent-sync, but agent-sync SOFT-SKIPS when node_modules isn't installed yet — so install the
      # app's frontend deps (pulls `spiderly` from Verdaccio → node_modules/spiderly/agent), then run
      # agent-sync explicitly to write AGENTS.md + the docs pointer + .claude/skills/spiderly-*.
      # NOTE: assumes `spiderly init` scaffolds a `Frontend/` — verify on the first real run.
      - name: Sync Spiderly agent guidance into the app
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          cd "${{ env.APP_FOLDER }}/Frontend"
          npm install
          cd "${{ env.APP_FOLDER }}"
          spiderly agent-sync

      # Apply the eval overlay: the add-validator PRE-task Product (Name present, NO validation).
      # We deliberately do NOT run tests/e2e-fixtures/setup.sh — that overlay's Product.Name already
      # has [Required]/[MaxLength(100)], which would make the task pre-satisfied (a no-op would pass).
      - name: Apply eval fixture overlay
        run: |
          ENTITIES="${{ env.APP_FOLDER }}/Backend/${{ env.TEST_APP_NAME }}.Business/Entities"
          mkdir -p "$ENTITIES"
          cp "$GITHUB_WORKSPACE/tools/agent-evals/tasks/atomic/add-validator/fixture/Product.cs" "$ENTITIES/Product.cs"
          sed -i "s/__APP_NAME__/${{ env.TEST_APP_NAME }}/g" "$ENTITIES/Product.cs"

      # Warm the build AND assert the pre-task state compiles — a broken baseline would make the
      # `compiles` check fail for reasons unrelated to the agent's work.
      - name: Build backend (warm + baseline sanity)
        run: |
          cd "${{ env.APP_FOLDER }}/Backend"
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Stage fixture (full real `spiderly init` app — guidance kept)
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          DEST="$GITHUB_WORKSPACE/tools/agent-evals/fixtures/spiderly-app"
          mkdir -p "$DEST"
          # Keep the WHOLE app — Backend + Frontend + the node_modules/spiderly/agent bundle the
          # guidance points at + AGENTS.md + CLAUDE.md + .claude/skills — dropping only .NET build
          # output. The with-Spiderly arm must mirror a real developer's app; stripping the guidance is
          # the bug we fixed. (-a preserves the .claude/skills symlinks agent-sync created.)
          rsync -a --exclude 'bin' --exclude 'obj' "${{ env.APP_FOLDER }}/" "$DEST/"
          # The .claude/skills symlinks were created against the build-time app path, which won't exist
          # at eval time — re-point them at the staged bundle so they resolve in each run's copy.
          cd "$DEST" && spiderly agent-sync

      # --- Run the agents (Claude CLI already installed + auth-verified above) ---
      - name: Run evals
        env:
          # Claude Pro/Max subscription token (headless `claude` reads this directly).
          # Subscription-only by design — do NOT switch to ANTHROPIC_API_KEY / per-use API-key billing.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cd tools
          node agent-evals/cli.mjs run \
            --agents "${{ inputs.agents }}" \
            --track agnostic \
            --tier "${{ inputs.tier }}" \
            --reps "${{ inputs.reps }}"

      - name: Append report to job summary
        if: always()
        run: |
          latest=$(ls -dt tools/agent-evals/results/*/ 2>/dev/null | head -1)
          if [ -n "$latest" ] && [ -f "${latest}report.md" ]; then
            cat "${latest}report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-eval-results
          path: |
            tools/agent-evals/results/**/matrix.json
            tools/agent-evals/results/**/report.md
          retention-days: 30
