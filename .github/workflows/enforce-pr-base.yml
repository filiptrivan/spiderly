name: Enforce PR base branch

# Contributions are integrated on `develop`; `main` is release-only and is
# fast-forwarded from `develop` by release.yml. GitHub defaults a PR's base to
# the repo's default branch (`main`), so PRs land on the wrong branch unless we
# retarget them.
#
# This runs as `pull_request_target` (required so fork PRs get a token that can
# edit the base) and therefore executes from the workflow file on the default
# branch (`main`). It must reach `main` to fire — which it does via release.yml's
# fast-forward — so a new copy here goes live at the next release, not before.
# It is committed on `develop` (the source of truth) so the ff-only release merge
# stays valid; a `main`-only commit would diverge `main` and break that merge.

on:
  pull_request_target:
    types: [opened, edited]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: Vankka/pr-target-branch-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target: main
          # Leave release.yml's own develop -> main fast-forward untouched.
          exclude: develop
          change-to: develop
          comment: |
            This repo integrates contributions on `develop` (`main` is release-only,
            kept in sync by automation), so I've automatically retargeted this PR's
            base to `develop`.

            Please check the diff for unrelated commits and rebase your branch onto
            `develop` if needed. Thanks for contributing!
