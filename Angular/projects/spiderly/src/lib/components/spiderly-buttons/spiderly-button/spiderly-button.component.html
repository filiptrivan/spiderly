<p-button
  (onClick)="handleClick($event)"
  [label]="iconUrl ? undefined : label"
  [icon]="icon"
  [outlined]="outlined"
  [styleClass]="styleClass"
  [severity]="severity"
  [rounded]="rounded"
  [style]="style"
  [class]="class"
  [disabled]="disabled"
  [size]="size"
  [type]="type"
>
  <ng-container *ngIf="iconUrl">
    <img [src]="iconUrl" [alt]="label" style="height: 18px; width: 18px; margin-right: 8px" />
    <span>{{ label }}</span>
  </ng-container>
  <ng-content></ng-content>
</p-button>
