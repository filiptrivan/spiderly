<ng-container *transloco="let t">
  <div
    #tableContainer
    class="spiderly-table-container"
    [attr.aria-busy]="isPending"
    [ngClass]="{
      'card responsive-card-padding overflow-auto': showCardWrapper
    }"
  >
    <p-table
      #dt
      [value]="items"
      [rows]="rows"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [rowHover]="true"
      [paginator]="showPaginator"
      responsiveLayout="scroll"
      [lazy]="hasLazyLoad"
      (onLazyLoad)="lazyLoad($event)"
      (onPage)="onPageChange(tableContainer)"
      [totalRecords]="totalRecords"
      class="spiderly-table"
      [loading]="isPending"
      [selectionMode]="selectionMode"
      dataKey="id"
      (onFilter)="filter($event)"
      sortMode="multiple"
      [multiSortMeta]="initialMultiSortMeta"
      [stateKey]="resolvedStateKey"
      [stateStorage]="stateStorage"
      [tableStyle]="tableStyle"
    >
      <ng-template pTemplate="caption">
        <div class="table-header overflow-auto">
          <div style="display: flex; align-items: center; gap: 8px">
            <i class="{{ tableIcon }}" style="font-size: 20px"></i>
            <div style="margin: 0px; font-size: 17.5px">{{ tableTitle }}</div>
          </div>
          <div style="display: flex; gap: 8px">
            <ng-container
              *ngIf="actionsTemplate"
              [ngTemplateOutlet]="actionsTemplate"
            ></ng-container>
            <button
              pButton
              *ngIf="hasLazyLoad"
              data-testid="column-chooser-button"
              [label]="t('Columns')"
              class="p-button-outlined"
              style="flex: none"
              icon="pi pi-sliders-h"
              (click)="columnChooser.toggle($event)"
            ></button>
            <!-- Only without a store: with one, the chip bar carries this, next to the chips
                 it clears. Two buttons a row apart for one job is what that replaced. -->
            <button
              pButton
              *ngIf="!filters"
              [label]="t('ClearFilters')"
              class="p-button-outlined"
              style="flex: none"
              icon="pi pi-filter-slash"
              (click)="clear(dt)"
            ></button>
            <button
              pButton
              *ngIf="showExportToExcelButton"
              [label]="t('ExportToExcel')"
              class="p-button-outlined"
              style="flex: none"
              icon="pi pi-download"
              (click)="exportListToExcel()"
            ></button>
            <button
              pButton
              *ngIf="showReloadTableButton"
              [label]="t('Reload')"
              class="p-button-outlined"
              style="flex: none"
              icon="pi pi-refresh"
              (click)="reload()"
            ></button>
            <button
              pButton
              *ngIf="deleteListFromTableObservableMethod && rowsSelectedNumber > 0"
              [label]="t('DeleteSelected') + ' (' + rowsSelectedNumber + ')'"
              class="p-button-danger"
              style="flex: none"
              icon="pi pi-trash"
              (click)="deleteSelectedObjects()"
            ></button>
          </div>
        </div>
        <!-- ONE menu for every column, with the target held in `menuColumn`. Rendering its items
             inside an @if keyed on the column would put them inside the popover's projected
             content, and PrimeNG does not re-project content an @if has destroyed — the filter
             bar's editor lost a whole afternoon to exactly that. -->
        <p-popover #columnMenu>
          <div class="column-menu" role="menu">
            <button
              type="button"
              role="menuitem"
              class="column-menu-item"
              data-testid="column-menu-hide"
              [disabled]="!menuColumn || !canToggleColumn(menuColumn)"
              (click)="hideMenuColumn()"
            >
              <i class="pi pi-eye-slash"></i>
              <span class="column-menu-item-label">{{ t('HideColumn') }}</span>
            </button>
            <button
              type="button"
              role="menuitem"
              class="column-menu-item"
              data-testid="column-menu-filter"
              [disabled]="!menuColumn || !canFilterColumn(menuColumn)"
              (click)="filterMenuColumn()"
            >
              <i class="pi pi-filter"></i>
              <span class="column-menu-item-label">{{ t('Filter') }}…</span>
            </button>
            <button
              type="button"
              role="menuitem"
              class="column-menu-item"
              data-testid="column-menu-sort-asc"
              [disabled]="!menuColumn || !isColumnSortable(menuColumn)"
              (click)="sortMenuColumn(1)"
            >
              <i class="pi pi-sort-amount-up-alt"></i>
              <span class="column-menu-item-label">{{ t('SortAscending') }}</span>
            </button>
            <button
              type="button"
              role="menuitem"
              class="column-menu-item"
              data-testid="column-menu-sort-desc"
              [disabled]="!menuColumn || !isColumnSortable(menuColumn)"
              (click)="sortMenuColumn(-1)"
            >
              <i class="pi pi-sort-amount-down"></i>
              <span class="column-menu-item-label">{{ t('SortDescending') }}</span>
            </button>
            <button
              type="button"
              role="menuitem"
              class="column-menu-item"
              data-testid="column-menu-left"
              [disabled]="!menuColumn || !canMoveColumn(menuColumn, -1)"
              (click)="moveMenuColumn(-1)"
            >
              <i class="pi pi-arrow-left"></i>
              <span class="column-menu-item-label">{{ t('MoveLeft') }}</span>
            </button>
            <button
              type="button"
              role="menuitem"
              class="column-menu-item"
              data-testid="column-menu-right"
              [disabled]="!menuColumn || !canMoveColumn(menuColumn, 1)"
              (click)="moveMenuColumn(1)"
            >
              <i class="pi pi-arrow-right"></i>
              <span class="column-menu-item-label">{{ t('MoveRight') }}</span>
            </button>
            <button
              type="button"
              role="menuitem"
              class="column-menu-item"
              data-testid="column-menu-fit"
              (click)="fitMenuColumn()"
            >
              <i class="pi pi-arrows-h"></i>
              <span class="column-menu-item-label">{{ t('FitWidth') }}</span>
            </button>
            <!-- menuitemcheckbox, not menuitem: this one TOGGLES, and a label reading the same
                 in both states leaves the operator to find out by clicking — which on a wide
                 column means re-laying the grid out to learn what it was already set to. The
                 check is the state; the label stays put, which is what the role is for. -->
            <button
              type="button"
              role="menuitemcheckbox"
              class="column-menu-item"
              data-testid="column-menu-wrap"
              [attr.aria-checked]="isMenuColumnWrapped"
              (click)="toggleWrapForMenuColumn()"
            >
              <i class="pi pi-align-left"></i>
              <span class="column-menu-item-label">{{ t('WrapText') }}</span>
              <i *ngIf="isMenuColumnWrapped" class="pi pi-check"></i>
            </button>
          </div>
        </p-popover>

        <div class="table-views" *ngIf="views?.length" role="tablist">
          <button
            *ngFor="let view of views"
            type="button"
            role="tab"
            class="table-view"
            data-testid="table-view"
            [class.table-view-active]="activeViewId === view.id"
            [attr.aria-selected]="activeViewId === view.id"
            (click)="selectView(view)"
          >
            {{ view.label }}
          </button>
        </div>

        <spiderly-filter-bar
          *ngIf="filters"
          [filters]="filters"
          [totalRecords]="totalRecords"
          [sort]="sortKeys"
          [controlTemplates]="filterTemplates"
          (clearAll)="clear(dt)"
        ></spiderly-filter-bar>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <!-- Sized for the checkbox plus the counter beside it, which shows `totalRecords` on a
               select-all and so reaches five digits on a large table. Not `0rem` (see CLAUDE.md →
               Column widths), and not routed through getColWidth: this column has no `Column`. -->
          <th
            #selectionHeader
            class="frozen-column"
            [class.frozen-column-last]="isSelectionColumnLastFrozen"
            [style.width]="selectionColumnWidth"
            [style.left]="'0'"
            *ngIf="selectionMode == 'multiple'"
          >
            <div style="display: flex; gap: 8px">
              <p-checkbox
                *ngIf="showSelectAllCheckbox"
                [disabled]="readonly"
                (onChange)="selectAll($event.checked)"
                [(ngModel)]="fakeIsAllSelected"
                [binary]="true"
              ></p-checkbox>
              ({{ rowsSelectedNumber }})
            </div>
          </th>
          <ng-container *ngFor="let col of visibleCols; trackBy: colTrackByFn">
            <th
              #headerCell
              [pSortableColumn]="col.field"
              [pSortableColumnDisabled]="!isColumnSortable(col)"
              [style.width]="getColWidth(col)"
              [class.frozen-column]="isColumnFrozen(col)"
              [class.frozen-column-last]="isLastFrozenColumn(col)"
              [style.left]="isColumnFrozen(col) ? frozenColumnOffset() : null"
              [attr.draggable]="hasLazyLoad && !col.lockVisible ? true : null"
              (mousedown)="onHeaderMouseDown($event)"
              (dragstart)="onHeaderDragStart(col, $event)"
              (dragover)="onHeaderDragOver(col, $event)"
              (drop)="onHeaderDrop(col, $event)"
            >
              <!-- Ours, not PrimeNG's: enabling [resizableColumns] makes it persist widths by
                   th:nth-child INDEX into our own stateKey, which slides every stored width onto
                   the wrong column the first time the chooser hides one (CLAUDE.md -> decision
                   5). We take the gesture and keep the state. -->
              <span
                *ngIf="hasLazyLoad && isDataColumn(col)"
                class="column-resizer"
                data-testid="column-resizer"
                (mousedown)="startColumnResize(col, $event, headerCell)"
              ></span>
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                "
              >
                <span style="display: flex; align-items: center; gap: 4px">
                  {{ col.name }}
                  <p-sortIcon
                    *ngIf="isColumnSortable(col)"
                    [field]="col.field!"
                  ></p-sortIcon>
                  <!-- stopPropagation is load-bearing: the th carries pSortableColumn, so a click
                       that reaches it sorts the grid. Opening a menu must not reorder the table on
                       the way. -->
                  <button
                    *ngIf="hasLazyLoad && isDataColumn(col)"
                    type="button"
                    class="column-menu-button"
                    data-testid="column-menu"
                    [attr.aria-label]="t('Columns')"
                    (click)="$event.stopPropagation(); openColumnMenu(col, $event)"
                  >
                    <i class="pi pi-chevron-down"></i>
                  </button>
                </span>
                <!-- hideOnClear: Apply is what closes this menu in PrimeNG (applyFilter =
                     _filter + hide), so wherever Apply is hidden Clear is the only button
                     left and would otherwise clear-and-linger. Committing a VALUE still
                     leaves the menu open deliberately — a multiselect gets ticked several
                     times per visit; dismissal is the popover's own (outside click, Esc). -->
                <p-columnFilter
                  *ngIf="showHeaderFilter(col)"
                  [type]="col.filterType"
                  [field]="filterKey(col)"
                  display="menu"
                  [placeholder]="col.filterPlaceholder"
                  [showOperator]="false"
                  [showMatchModes]="col.showMatchModes"
                  [showAddButton]="col.showAddButton"
                  [showApplyButton]="!filterAppliesOnChange(col.filterType)"
                  [hideOnClear]="true"
                  [matchModeOptions]="getColMatchModeOptions(col)"
                  [matchMode]="getColMatchMode(col)"
                >
                  <!-- Marks a filtered column — PrimeNG's own <FilterIcon> cannot
                       (CLAUDE.md → "Active-filter header icon"). Colour: the SCSS. -->
                  <ng-template pTemplate="filtericon">
                    <i
                      [class]="
                        isColumnFiltered(col) ? 'pi pi-filter-fill' : 'pi pi-filter'
                      "
                    ></i>
                  </ng-template>
                  <ng-template
                    *ngIf="isDropOrMulti(col.filterType)"
                    pTemplate="filter"
                    let-value
                    let-filter="filterCallback"
                  >
                    <p-multiSelect
                      [ngModel]="value"
                      [options]="col.dropdownOrMultiselectValues"
                      [placeholder]="t('All')"
                      (onChange)="filter($event.value)"
                      optionLabel="label"
                      optionValue="code"
                      [style]="{ width: '240px' }"
                    >
                      <ng-template let-item pTemplate="item">
                        <div class="p-multiselect-representative-option">
                          <span class="ml-2">{{ item.label }}</span>
                        </div>
                      </ng-template>
                    </p-multiSelect>
                  </ng-template>
                  <ng-template
                    *ngIf="col.filterType == 'date'"
                    pTemplate="filter"
                    let-value
                    let-filter="filterCallback"
                  >
                    <p-datepicker
                      [ngModel]="value"
                      [showTime]="col.showTime"
                      (onSelect)="filter($event)"
                    ></p-datepicker>
                  </ng-template>
                </p-columnFilter>
              </div>
            </th>
          </ng-container>
        </tr>
      </ng-template>
      <ng-template
        pTemplate="body"
        let-rowData
        let-index="rowIndex"
        let-editing="editing"
      >
        <!-- The cell rendering every column gets unless it projects a spiderlyCellTemplate. Declared
             once here rather than inside the column loop, and fed the same context the projected
             template gets, so getRowData is evaluated exactly once per cell either way. -->
        <ng-template #defaultCell let-col="col" let-displayValue="displayValue">
          <ng-container *ngIf="col.filterType === 'blob'">
            <img width="45" [src]="displayValue" alt="" />
          </ng-container>
          <ng-container *ngIf="col.filterType !== 'blob'">
            <span
              spiderlyOverflowTitle
              class="cell-text"
              [class.cell-text-wrap]="isColumnWrapped(col)"
              >{{ displayValue }}</span
            >
          </ng-container>
        </ng-template>
        <tr
          [class.clickable]="navigateOnRowClick"
          (click)="onRowClick(rowData, $event)"
        >
          <!-- row-interactive: a selection gesture must never double as row navigation (onRowClick). -->
          <td
            *ngIf="selectionMode == 'multiple'"
            class="selection-cell row-interactive frozen-column"
            [class.frozen-column-last]="isSelectionColumnLastFrozen"
            [style.left]="'0'"
            (mousedown)="onSelectionCellMouseDown($event, rowData[idField])"
          >
            <p-checkbox
              [disabled]="readonly"
              (onChange)="selectRow(rowData[idField], rowData.index)"
              [ngModel]="isRowSelected(rowData[idField])"
              [binary]="true"
            ></p-checkbox>
          </td>
          <ng-container *ngFor="let col of visibleCols; trackBy: colTrackByFn">
            <td
              [style]="getStyleForBodyColumn(col)"
              [class.clickable]="col.onCellClick"
              [class.row-interactive]="col.onCellClick"
              [class.frozen-column]="isColumnFrozen(col)"
              [class.frozen-column-last]="isLastFrozenColumn(col)"
              [style.left]="isColumnFrozen(col) ? frozenColumnOffset() : null"
              (click)="onCellClick(col, rowData, $event)"
              *ngIf="!col.editable"
            >
              <!-- getColWidth reserves this column's width from `actions.length`; this gap is
                   the geometry it reserves for, so changing it belongs in the same edit. -->
              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 18px;
                "
              >
                <ng-container
                  *ngFor="let action of col.actions; trackBy: actionTrackByFn"
                >
                  <span
                    [pTooltip]="action.name"
                    [class]="getClassForAction(action) + ' row-interactive'"
                    [style]="getStyleForAction(action)"
                    (click)="getMethodForAction(action, rowData, $event)"
                  ></span>
                </ng-container>
              </div>
              <ng-container
                [ngTemplateOutlet]="getCellTemplate(col) ?? defaultCell"
                [ngTemplateOutletContext]="{
                  $implicit: rowData,
                  value: rowData[col.field],
                  displayValue: getRowData(rowData, col),
                  col: col
                }"
              ></ng-container>
            </td>
            <td
              *ngIf="col.editable"
              class="row-interactive"
              [class.frozen-column]="isColumnFrozen(col)"
              [class.frozen-column-last]="isLastFrozenColumn(col)"
              [style.left]="isColumnFrozen(col) ? frozenColumnOffset() : null"
            >
              <spiderly-number
                [control]="getFormArrayControlByIndex(col.field, rowData.index)"
                [showLabel]="false"
              ></spiderly-number>
            </td>
          </ng-container>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td
            [attr.colspan]="
              visibleCols.length + (selectionMode === 'multiple' ? 1 : 0)
            "
          >
            {{ t("NoRecordsFound") }}
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="paginatorleft">
        {{ t("TotalRecords") }}: {{ totalRecords }}
      </ng-template>
      <ng-template pTemplate="paginatorright">
        <div style="display: flex; justify-content: end; gap: 10px">
          <spiderly-button
            *ngIf="showAddButton"
            [label]="t('AddNew')"
            icon="pi pi-plus"
            (onClick)="navigateToDetails(0)"
          ></spiderly-button>
        </div>
      </ng-template>
    </p-table>
    <p-popover #columnChooser>
      <div class="column-chooser">
        <label
          *ngFor="let col of chooserCols; trackBy: colTrackByFn"
          data-testid="column-chooser-option"
          class="column-chooser-option"
        >
          <p-checkbox
            [binary]="true"
            [ngModel]="isColumnVisible(col)"
            [disabled]="!canToggleColumn(col)"
            (onChange)="toggleColumn(col, $event.checked)"
          ></p-checkbox>
          <span>{{ col.name }}</span>
        </label>
        <button
          type="button"
          data-testid="column-chooser-reset"
          class="column-chooser-reset"
          (click)="resetColumnLayout()"
        >
          {{ t('ResetToDefault') }}
        </button>
      </div>
    </p-popover>
  </div>
</ng-container>
