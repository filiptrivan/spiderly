<ng-container *transloco="let t">
  <div class="flex min-h-screen overflow-hidden p-5">
    <div class="flex flex-col w-full">
      <div
        class="w-full sm:w-120"
        style="
          margin: auto;
          border-radius: 50px;
          padding: 0.3rem;
          background: linear-gradient(
            180deg,
            var(--p-primary-color) 10%,
            rgba(33, 150, 243, 0) 30%
          );
        "
      >
        <div
          class="surface-card py-12 px-8 sm:px-12"
          style="border-radius: 45px"
        >
          <div class="text-center" style="margin-bottom: 38px">
            <img
              *ngIf="image != null"
              [src]="image"
              alt="{{ companyName }} Logo"
              title="{{ companyName }} Logo"
              height="60"
            />
            <i
              *ngIf="image == null"
              class="pi pi-spin pi-spinner primary-color"
              style="font-size: 2rem"
            ></i>
          </div>

          <ng-content></ng-content>

          <div *ngIf="config.showGoogleAuth">
            <div
              style="
                display: flex;
                align-items: center;
                gap: 7px;
                justify-content: center;
                margin-bottom: 16px;
              "
            >
              <div class="separator"></div>
              <div>{{ t("or") }}</div>
              <div class="separator"></div>
            </div>
            <div>
              <!-- https://code-maze.com/how-to-sign-in-with-google-angular-aspnet-webapi/ -->
              <google-button
                (loginWithGoogle)="onGoogleSignIn($event)"
                [label]="t('ContinueWithGoogle')"
              ></google-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
