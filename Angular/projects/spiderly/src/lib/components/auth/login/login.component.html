<ng-container *transloco="let t">
  @if (loginFormGroup != null) {
    @if (showEmailSentDialog == false) {
      <spiderly-auth-card>
        <form [formGroup]="loginFormGroup" style="margin-bottom: 16px">
          <div>
            <spiderly-textbox
              [control]="loginFormGroup.getControl('email')"
            ></spiderly-textbox>
          </div>

          <div class="mt-4 mb-6">
            <div class="text-center" style="font-size: smaller">
              {{ t("AgreementsOnRegister") }}
              <b
                routerLink="/user-agreement"
                class="primary-color cursor-pointer"
                >{{ t("UserAgreement") }}</b
              >
              {{ t("and") }}
              <b
                routerLink="/privacy-policy"
                class="primary-color cursor-pointer"
                >{{ t("PrivacyPolicy") }}</b
              >.
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 16px">
            <spiderly-button
              [label]="t('Login')"
              (onClick)="sendLoginVerificationEmail()"
              [outlined]="true"
              [style]="{ width: '100%' }"
              type="submit"
            ></spiderly-button>
          </div>
        </form>

        <spiderly-external-login
          [providerIcons]="providerIcons"
        ></spiderly-external-login>
      </spiderly-auth-card>
    } @else {
      <login-verification
        [email]="loginFormGroup.controls.email.getRawValue()"
      ></login-verification>
    }

    <!--
      General projection slot for consumer-supplied login extras (a bot-challenge widget, a notice,
      an extra field, …). Rendered in BOTH the email-entry and code-verification states — outside the
      showEmailSentDialog toggle — so projected content survives the email → resend flow (e.g. a
      single-use challenge widget that must stay mounted to issue a fresh token on resend).
      Project with the `loginExtra` attribute: <spiderly-login><my-widget loginExtra/></spiderly-login>.
    -->
    <ng-content select="[loginExtra]"></ng-content>
  }
</ng-container>
