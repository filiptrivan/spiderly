<ng-container *transloco="let t">
  <div class="flex min-h-screen overflow-hidden" style="padding: 20px">
    <div class="flex flex-col w-full">
      <div
        class="w-full sm:w-[30rem]"
        style="
          margin: auto;
          border-radius: 50px;
          padding: 0.3rem;
          background: linear-gradient(
            180deg,
            var(--p-primary-color) 10%,
            rgba(33, 150, 243, 0) 30%
          );
        "
      >
        <div class="surface-card py-12 px-8 sm:px-12" style="border-radius: 45px">
          <div class="text-center">
            <img
              [src]="logoPath"
              [alt]="t('spiderly.CompanyLogo', { companyName: companyName })"
              [title]="t('spiderly.CompanyLogo', { companyName: companyName })"
              height="60"
              class="mb-6"
            />
          </div>
          <h1 class="mb-6">
            <div class="font-bold text-5xl lg:text-6xl spiderly-gradient-title">
              404
            </div>
            <div class="font-bold text-5xl lg:text-6xl">{{ t('spiderly.PageNotFoundTitle') }}</div>
          </h1>
          <div class="text-gray-600 text-lg mb-8">
            {{ t('spiderly.PageNotFoundDetails') }}
          </div>
          <div>
            <p-button [routerLink]="['/']" [label]="t('spiderly.GoToHomepage')"></p-button>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
