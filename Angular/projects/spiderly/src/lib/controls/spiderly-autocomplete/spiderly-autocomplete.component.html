<ng-container *transloco="let t">
  <div style="display: flex; flex-direction: column; gap: 0.5rem">
    <div *ngIf="getTranslatedLabel() != '' && getTranslatedLabel() != null">
      <!-- By passing an empty string we remove the label entirely -->
      <label>{{ getTranslatedLabel() }}</label>
      <required *ngIf="control?.required && showRequired"></required>
    </div>

    <!-- Don't support p-inputgroup -->
    <p-autocomplete
      *ngIf="control"
      [id]="label"
      [formControl]="helperFormControl"
      [placeholder]="placeholder"
      [suggestions]="options"
      (completeMethod)="search($event)"
      [forceSelection]="true"
      [dropdown]="false"
      [showClear]="showClear"
      (onHide)="autocompleteMarkAsDirty()"
      (onSelect)="select($event)"
      (onClear)="clear()"
      [completeOnFocus]="true"
      [fluid]="true"
      [style]="{ width: '100%' }"
      [appendTo]="appendTo"
      [emptyMessage]="emptyMessage"
      [lazy]="true"
      optionLabel="displayName"
    ></p-autocomplete>
    <small *ngIf="control?.errors && control?.dirty" class="spiderly-error-message">
      {{ getValidationErrrorMessages() }}
    </small>
  </div>
</ng-container>
