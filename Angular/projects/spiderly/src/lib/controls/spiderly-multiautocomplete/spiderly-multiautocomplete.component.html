<ng-container *transloco="let t">
  <div style="display: flex; flex-direction: column; gap: 0.5rem">
    <div>
      <label>{{ getTranslatedLabel() }}</label>
      <required *ngIf="control?.required && showRequired"></required>
    </div>

    <!-- Don't support p-inputgroup -->
    <!-- Showing label fix: https://github.com/primefaces/primeng/issues/17332#issuecomment-2922861294 -->
    <p-autocomplete
      *ngIf="control"
      [id]="label"
      [formControl]="control"
      [placeholder]="placeholder"
      [suggestions]="options"
      (completeMethod)="search($event)"
      [forceSelection]="true"
      [multiple]="true"
      [dropdown]="false"
      [showClear]="true"
      (onHide)="dropdownMarkAsDirty()"
      [completeOnFocus]="true"
      dropdownIcon="pi pi-plus"
      [fluid]="true"
      [style]="{ width: '100%' }"
      appendTo="body"
      optionLabel="displayName"
      dataKey="id"
    >
    </p-autocomplete>
    <small *ngIf="control?.errors && control?.dirty" class="spiderly-error-message">
      {{ getValidationErrrorMessages() }}
    </small>
  </div>
</ng-container>
