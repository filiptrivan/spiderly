<div style="display: flex; flex-direction: column; gap: 0.5rem">
  <div
    *ngIf="
      inlineLabel === false &&
      getTranslatedLabel() != '' &&
      getTranslatedLabel() != null
    "
  >
    <label>{{ getTranslatedLabel() }}</label>
    <required *ngIf="control?.required && showRequired"></required>
  </div>
  <div style="margin-top: 0.5rem; position: relative">
    <!-- The margin-top is intentional: it vertically aligns the checkbox with other input controls that have greater height. -->
    <p-checkbox
      *ngIf="control"
      [pTooltip]="getValidationErrrorMessages()"
      [tooltipEvent]="errorMessageTooltipEvent"
      tooltipPosition="bottom"
      [tooltipDisabled]="control.valid"
      tooltipStyleClass="spiderly-tooltip-invalid"
      [formControl]="control"
      [value]="inlineLabel ? label : null"
      [id]="label"
      [binary]="true"
      (onChange)="change($event)"
    />
  </div>
</div>
