<!-- Can't put (onBlur) in this control -->

<div style="display: flex; flex-direction: column; gap: 0.5rem">
  <div>
    <label>{{ getTranslatedLabel() }}</label>
    <required *ngIf="control?.required && showRequired"></required>
  </div>
  <textarea
    *ngIf="control"
    pTextarea
    [formControl]="control"
    [id]="control.label"
    (blur)="control.markAsDirty()"
    [autoResize]="true"
    [class]="control.disabled ? 'disabled' : ''"
  ></textarea>
  <small *ngIf="control?.errors && control?.dirty" class="spiderly-error-message">
    {{ getValidationErrrorMessages() }}
  </small>
</div>
