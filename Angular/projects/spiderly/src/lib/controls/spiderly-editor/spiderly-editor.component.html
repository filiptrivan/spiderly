<!-- Can't put (onBlur) in this control -->

<div style="display: flex; flex-direction: column; gap: 0.5rem; padding: 0 1px">
  <div *ngIf="getTranslatedLabel() != '' && getTranslatedLabel() != null">
    <label>{{ getTranslatedLabel() }}</label>
    <required *ngIf="control?.required && showRequired"></required>
  </div>

  <!-- Disable doesn't work on this control -->
  <p-editor
    *ngIf="control"
    [formControl]="control"
    [readonly]="control.disabled"
    [class]="control.invalid && control.dirty ? 'control-error-border' : ''"
    [id]="control.label"
    [placeholder]="placeholder"
    (click)="onClick()"
    (onInit)="onEditorInit($event)"
    [style]="{ height: '320px' }"
  ></p-editor>
  <small *ngIf="control?.errors && control?.dirty" class="spiderly-error-message">
    {{ getValidationErrrorMessages() }}
  </small>
</div>
