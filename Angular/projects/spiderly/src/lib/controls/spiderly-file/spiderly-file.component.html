<ng-container *transloco="let t">
  <div style="display: flex; flex-direction: column; gap: 0.5rem; padding: 1px">
    <div *ngIf="getTranslatedLabel() != '' && getTranslatedLabel() != null">
      <label>{{ getTranslatedLabel() }}</label>
      <!-- It's okay for this control, because for the custom uploads where we are not initializing the control from the backend, there is no need for formControl. -->
      <required *ngIf="control?.required || required"></required>
    </div>

    <p-fileUpload
      [files]="files"
      [disabled]="disabled"
      [name]="control?.label ?? label"
      [multiple]="multiple"
      [accept]="acceptedFileTypesCommaSeparated"
      [maxFileSize]="maxFileSize"
      (onSelect)="filesSelected($event)"
      [class]="control?.invalid && control?.dirty ? 'control-error-border' : ''"
    >
      <ng-template
        pTemplate="header"
        let-files
        let-chooseCallback="chooseCallback"
        let-clearCallback="clearCallback"
        let-uploadCallback="uploadCallback"
      >
        <div
          class="flex flex-wrap justify-between items-center flex-1 gap-2"
        >
          <div class="flex gap-2">
            <spiderly-button
              [disabled]="disabled"
              (onClick)="choose($event, chooseCallback)"
              icon="pi pi-upload"
              [rounded]="true"
              [outlined]="true"
            />
          </div>
        </div>
      </ng-template>
      <ng-template
        pTemplate="content"
        let-files
        let-removeFileCallback="removeFileCallback"
      >
        <div *ngIf="existingFileUrl">
          <div class="flex justify-center p-0 gap-8">
            <div
              class="card m-0 px-4 py-4 flex flex-col items-center gap-4"
              style="justify-content: center; overflow: hidden"
            >
              <div *ngIf="existingFileIsImage" class="image-container">
                <img [src]="existingFileUrl" />
              </div>
              <div *ngIf="!existingFileIsImage">
                <i class="pi pi-file" style="margin-right: 4px"></i>
                <span>{{ existingFileName }}</span>
              </div>
              <spiderly-button
                [disabled]="disabled"
                icon="pi pi-times"
                (onClick)="removeExistingFile()"
                [outlined]="true"
                [rounded]="true"
                severity="danger"
              />
            </div>
          </div>
        </div>
        <div *ngIf="!existingFileUrl && files.length > 0">
          <div class="flex justify-center p-0 gap-8">
            <div
              *ngFor="let file of files; let index = index"
              class="card m-0 px-4 py-4 flex flex-col items-center gap-4"
              style="justify-content: center; overflow: hidden"
            >
              <div *ngIf="isFileImageType(file.type)" class="image-container">
                <img role="presentation" [src]="file.objectURL" />
              </div>
              <div *ngIf="isExcelFileType(file.type)" class="excel-container">
                <div class="excel-details">
                  <i
                    class="pi pi-file-excel"
                    style="color: green; margin-right: 4px"
                  ></i>
                  <span class="file-name">{{ file.name }}</span>
                </div>
              </div>
              <spiderly-button
                [disabled]="disabled"
                icon="pi pi-times"
                (onClick)="fileRemoved(removeFileCallback, index)"
                [outlined]="true"
                [rounded]="true"
                severity="danger"
              />
            </div>
          </div>
        </div>
      </ng-template>
      <ng-template pTemplate="file"> </ng-template>
      <ng-template pTemplate="empty">
        <div *ngIf="!existingFileUrl" class="flex items-center justify-center flex-col">
          <i
            class="pi pi-cloud-upload border-2 rounded-full p-8 text-8xl text-gray-400 border-gray-400 mt-4"
          ></i>
          <p class="mt-6 mb-0">{{ t("DragAndDropFilesHereToUpload") }}</p>
        </div>
      </ng-template>
    </p-fileUpload>
  </div>
</ng-container>
